services:
  - type: web
    name: wow-armory-api
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    startCommand: npm start
    envVars:
      - key: BLIZZARD_CLIENT_ID
      - key: BLIZZARD_CLIENT_SECRET
      - key: SIMC_PATH
      - key: REPORTS_DIR
        value: /var/data/reports
      - key: CACHE_DIR
        value: /var/data/cache
    disks:
      - name: wow-armory-data
        mountPath: /var/data
        sizeGB: 1
